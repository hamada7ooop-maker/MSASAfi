<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لا يوجد اتصال — مصاريفي</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f0f4ff;
      --card: #fff;
      --primary: #002b59;
      --accent: #1a4175;
      --text: #1e293b;
      --sub: #64748b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1621;
        --card: #1a2235;
        --primary: #4d8fff;
        --accent: #3b6fd4;
        --text: #e2e8f0;
        --sub: #94a3b8;
      }
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', 'Noto Sans Arabic', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border-radius: 32px;
      padding: 48px 32px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,43,89,0.12);
    }
    .icon-wrap {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e8f0fe, #d0e0ff);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      animation: pulse 2.5s ease-in-out infinite;
    }
    @media (prefers-color-scheme: dark) {
      .icon-wrap { background: linear-gradient(135deg, #1a2a4a, #0d1d38); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(1.06); opacity: 0.85; }
    }
    .icon-wrap svg {
      width: 52px;
      height: 52px;
      stroke: var(--primary);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 22px;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: var(--sub);
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .btn-primary {
      display: block;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(0,43,89,0.25);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-primary:active { transform: scale(0.97); box-shadow: 0 4px 12px rgba(0,43,89,0.2); }
    .tip {
      font-size: 12px;
      color: var(--sub);
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(100,116,139,0.15);
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ef4444;
      display: inline-block;
      margin-left: 6px;
      animation: blink 1.2s step-end infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--sub);
      margin-bottom: 28px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <!-- Wifi off icon -->
      <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </div>

    <div class="status">
      <span class="dot"></span>
      <span id="status-text">أنت غير متصل بالإنترنت</span>
    </div>

    <h1>التطبيق يعمل بدون نت 💡</h1>
    <p>
      مصاريفي يحفظ بياناتك محلياً على جهازك.
      يمكنك الاستمرار في تسجيل المصاريف والدخل بدون اتصال.
    </p>

    <button class="btn-primary" onclick="tryReload()">
      🔄 إعادة المحاولة
    </button>

    <p class="tip">
      📌 تذكير: بياناتك آمنة على جهازك حتى في وضع عدم الاتصال
    </p>
  </div>

  <script>
    function tryReload() {
      if (navigator.onLine) {
        window.location.href = '/';
      } else {
        const btn = document.querySelector('.btn-primary');
        btn.textContent = '⏳ لا يزال غير متصل...';
        setTimeout(() => btn.textContent = '🔄 إعادة المحاولة', 2000);
      }
    }

    // Auto-redirect when connection restored
    window.addEventListener('online', () => {
      document.getElementById('status-text').textContent = '✅ تم استعادة الاتصال!';
      document.querySelector('.dot').style.background = '#22c55e';
      setTimeout(() => window.location.href = '/', 1200);
    });

    // Check connection state
    if (navigator.onLine) {
      window.location.href = '/';
    }
  </script>
</body>
</html>
