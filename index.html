<script>
  function safeShowError(title, msg, detail) {
    if (!location.hostname.includes('localhost') && !location.hostname.includes('127.0.0.1')) return;
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;bottom:10px;right:10px;background:#ef4444;color:white;z-index:999999;padding:12px 16px;border-radius:12px;max-width:90vw;font-size:12px;box-shadow:0 10px 25px rgba(0,0,0,0.3);';
    d.innerHTML = '<strong>' + title + ':</strong> ' + msg + (detail ? '<pre style="margin-top:4px;font-size:10px;opacity:0.8;">' + detail + '</pre>' : '');
    if (document.body) {
      document.body.appendChild(d);
    } else {
      window.addEventListener('DOMContentLoaded', function() { document.body && document.body.appendChild(d); });
    }
  }
  window.addEventListener('error', function(e) {
    if (e.message && e.message.includes('ResizeObserver')) return;
    safeShowError('Global Error', e.message, e.filename ? (e.filename + ':' + e.lineno) : '');
  });
  window.addEventListener('unhandledrejection', function(e) {
    var reason = e.reason && e.reason.message ? e.reason.message : String(e.reason || '');
    if (['Transition was skipped', 'aborted', 'The user aborted'].some(function(s) { return reason.includes(s); })) return;
    safeShowError('Unhandled Rejection', reason);
  });
</script>

<script>
  // Service Worker for PWA offline support (Production only, skip on localhost & native app)
  if ('serviceWorker' in navigator) {
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      navigator.serviceWorker.getRegistrations().then(regs => {
        for (const reg of regs) reg.unregister();
      });
    } else if (!window.Capacitor) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(reg => console.log('[SW] Registered:', reg.scope))
          .catch(err => console.warn('[SW] Registration failed:', err));
      });
    }
  }
  // Offline/online indicator
  const offlineToast = document.getElementById('offline-toast');
  function syncOfflineState() {
    if (offlineToast) {
      offlineToast.style.display = navigator.onLine ? 'none' : 'flex';
    }
  }
  window.addEventListener('online',  syncOfflineState);
  window.addEventListener('offline', syncOfflineState);
  syncOfflineState();
</script>
