apply plugin: 'com.android.application'

// ─── Directive 17 part 2: conditional Crashlytics activation ────────────────
// google-services.json is a per-owner Firebase credential, deliberately
// gitignored (see .gitignore). The plugin classpaths are already declared in
// the root build.gradle, and the native library already arrives through
// @capacitor-firebase/crashlytics (see capacitor.build.gradle). Applying the
// Google Services + Crashlytics plugins ONLY when the file exists keeps every
// build green without it — dropping the file into android/app/ is then the
// ONLY step needed to activate crash reporting end-to-end (scripts/release.mjs
// mirrors this check and sets VITE_CRASH_REPORTING=true accordingly).
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
}

android {
    namespace "com.masarifi.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.masarifi.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 230006
        versionName "23.0.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (project.hasProperty('MASARIFI_RELEASE_STORE_FILE') && file(MASARIFI_RELEASE_STORE_FILE).exists()) {
                storeFile file(MASARIFI_RELEASE_STORE_FILE)
                storePassword MASARIFI_RELEASE_STORE_PASSWORD
                keyAlias MASARIFI_RELEASE_KEY_ALIAS
                keyPassword MASARIFI_RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (project.hasProperty('MASARIFI_RELEASE_STORE_FILE') && file(MASARIFI_RELEASE_STORE_FILE).exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
